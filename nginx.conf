# limit_req_zone $http_authorization zone=peruser:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:2m rate=1r/s;
limit_req_status 429;

server {
  listen 80;
  server_name api.mydomain.com;
  
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}
server {
  listen 443 ssl;
  server_name api.mydomain.com;

  ssl_certificate     /etc/letsencrypt/live/divinecharisma.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/divinecharisma.duckdns.org/privkey.pem;

  client_max_body_size 1m;

  proxy_set_header Host $host;                        # domain client asked for
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;      # same as one above. different tools expect different ones
  proxy_set_header X-Forwarded-Proto $scheme;         # protocol (http or https)

  location / {
    # limit_req zone=peruser burst=20 nodelay;
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://server:8080;
  }

  location = /auth/login {
    limit_req zone=login burst=8 nodelay;
    proxy_pass http://server:8080;
  }
}
