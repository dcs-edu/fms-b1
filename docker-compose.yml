services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      POSTGRES_DB: ${DB_NAME}
    restart: unless-stopped
    volumes:
      - volume_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 10s
                                               
  server:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      DB_URL: postgres://${DB_USER}:${DB_PWD}@db:5432/${DB_NAME}?sslmode=disable
      JWTSECRET: ${JWTSECRET}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_PASS: ${SMTP_PASS}
                                              
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - server
                                              
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
                                              
  migrate:
    image: migrate/migrate
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    command: 
      - "-path" 
      - "./migrations/" 
      - "-database" 
      - "postgres://${DB_USER}:${DB_PWD}@db:5432/${DB_NAME}?sslmode=disable"
      - "up"
                                              
volumes:
  volume_1:

                                              
